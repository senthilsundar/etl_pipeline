version: 2

models:
  - name: stg_users
    columns:
      - name: email
        tests:
          - not_null
      - name: gender
        tests:
          - accepted_values:
              values: ['male', 'female', 'other']
      - name: state
        tests:
          - accepted_values:
              values: ['Alabama']

  - name: dim_users
    columns:
      - name: user_id
        tests:
          - not_null
          - unique
      - name: email
        tests:
          - not_null
          - unique
      - name: gender
        tests:
          - accepted_values:
              values: ['male', 'female', 'other']
